[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bellum-tool"
version = "1.1.0"
description = "Native Linux (Qt6/PySide6) GUI to manage PAX PayDroid terminals over ADB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Glitchboi-sudo" }]
keywords = ["pax", "paydroid", "adb", "pos", "qt", "pyside6", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/Glitchboi-sudo/Bellum-Tool"
Repository = "https://github.com/Glitchboi-sudo/Bellum-Tool.git"
Wiki = "https://github.com/Glitchboi-sudo/Bellum-Tool/wiki"
Issues = "https://github.com/Glitchboi-sudo/Bellum-Tool/issues"

[project.gui-scripts]
bellum-tool = "bellum.app:main"

[tool.setuptools]
packages = [
    "bellum",
    "bellum.core",
    "bellum.ui",
    "bellum.ui.pages",
]
