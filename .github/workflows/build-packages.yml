name: Build Linux packages

# Builds installable packages for the popular Linux families on every push and
# pull request. When a version tag (v*) is pushed, the artifacts are also
# attached to a GitHub Release.
#
#   .deb           -> Debian / Ubuntu / Linux Mint / Pop!_OS
#   .rpm           -> Fedora / RHEL / CentOS / openSUSE
#   .pkg.tar.zst   -> Arch / Manjaro / EndeavourOS
#   .AppImage      -> universal (runs almost anywhere)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on tags

jobs:
  # ---------------------------------------------------------------- wheel ---
  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # ------------------------------------------------------------ deb + rpm ---
  deb-rpm:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    needs: wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
      - name: Stage self-contained bundle
        run: packaging/stage-bundle.sh stage "$(ls dist/*.whl)"
      - name: Read version
        id: ver
        run: echo "v=$(python -c 'import bellum; print(bellum.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build .deb
        run: |
          fpm -s dir -t deb -n bellum-tool -v "${{ steps.ver.outputs.v }}" \
            --license "GPL-3.0-or-later" \
            --description "Native Linux GUI to manage PAX PayDroid terminals over ADB" \
            --url "https://github.com/Glitchboi-sudo/Bellum-Tool" \
            --maintainer "Glitchboi-sudo" \
            --depends python3 \
            --deb-recommends android-tools-fastboot \
            -C stage .
      - name: Build .rpm
        run: |
          fpm -s dir -t rpm -n bellum-tool -v "${{ steps.ver.outputs.v }}" \
            --license "GPLv3+" \
            --description "Native Linux GUI to manage PAX PayDroid terminals over ADB" \
            --url "https://github.com/Glitchboi-sudo/Bellum-Tool" \
            --maintainer "Glitchboi-sudo" \
            --depends python3 \
            -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-deb-rpm
          path: |
            *.deb
            *.rpm

  # -------------------------------------------------------------- AppImage ---
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04   # older glibc = broader compatibility
    needs: wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install python-appimage
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-appimage
      - name: Build AppImage
        run: packaging/build-appimage.sh "$(ls dist/*.whl)" "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-appimage
          path: out/*.AppImage

  # ------------------------------------------------------------------ Arch ---
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    needs: wheel
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm base-devel git python-build python-installer \
            python-wheel python-setuptools pyside6 sudo
      - name: Build package (makepkg cannot run as root)
        run: |
          useradd -m builder
          cp packaging/PKGBUILD .
          # Build straight from the checked-out tree instead of downloading a tag.
          sed -i "s#^source=.*#source=()#; s#^sha256sums=.*#sha256sums=()#" PKGBUILD
          sed -i 's#\$srcdir/Bellum-Tool-\$pkgver#\$startdir#g' PKGBUILD
          chown -R builder:builder .
          sudo -u builder makepkg -f --noconfirm --skipchecksums
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-arch
          path: "*.pkg.tar.zst"

  # --------------------------------------------------------------- release ---
  release:
    name: Attach packages to Release
    runs-on: ubuntu-latest
    needs: [deb-rpm, appimage, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
          generate_release_notes: true
